<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>System Designer</title>
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar claro ao abrir no escuro).
      // A mesma chave é usada em src/store/view.ts.
      try {
        const saved = localStorage.getItem('system-designer:theme')
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
